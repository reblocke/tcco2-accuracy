name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch public branch and tag refs
        run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Verify public history
        run: uv run python scripts/check_public_history.py

      - name: Stage web assets
        run: make stage-web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # deploy-pages@v5 is Node 24-native but its released bundle emits DEP0040.
        # Remove this narrow suppression after https://github.com/actions/deploy-pages/issues/413 is released.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
        uses: actions/deploy-pages@v5
