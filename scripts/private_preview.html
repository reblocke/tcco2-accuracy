<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'sha256-VIEWER_SCRIPT_HASH'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Private PaCO₂ prediction</title>
  <style>
/* SHARED_STYLES */
    body { margin: 0; }
    main { width: min(840px, 92%); margin: 24px auto 40px; }
    header { padding-bottom: 12px; }
    h1 { font-size: clamp(28px, 4vw, 42px); }
    #file-panel { margin: 14px 0; }
    #file-panel label { margin-top: 12px; }
    #chart-file { width: min(100%, 440px); }
    #chart-status:empty { display: none; }
    #private-result { background: white; border: 1px solid var(--line); border-radius: 5px;
                      padding: clamp(12px, 3vw, 26px); }
    #private-context { margin: 0 0 6px; }
    #private-bounds { display: block; font: 500 clamp(28px, 4vw, 42px) Georgia, serif; }
    #private-summary { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
    #private-median { margin: 4px 0 0; }
  </style>
</head>
<body>
<main>
  <header><h1>Private PaCO₂ prediction</h1><small>Research use only · Individual-patient coverage has yet to be validated.</small></header>
  <details id="file-panel" open>
    <summary id="file-summary">Open private chart</summary>
    <label for="chart-file">Choose private-chart.json from the same folder as this page.</label>
    <input id="chart-file" type="file" accept="application/json,.json">
    <p class="note">This viewer opens the file on this device and works without an internet connection.</p>
  </details>
  <p id="chart-status" role="status"></p>
  <section id="private-result" aria-label="Paired arterial prediction" hidden>
    <div id="private-grid" hidden>
      <label for="private-setting">Setting</label>
      <select id="private-setting"><option value="all">All eligible settings</option><option value="icu">ICU proxy</option><option value="ed_inp">ED / inpatient</option><option value="pft">Ambulatory</option></select>
      <label for="private-reading">Observed TcCO₂ (mmHg)</label>
      <input id="private-reading" type="number" min="20" max="100" step="1" value="47">
    </div>
    <div id="private-summary" aria-live="polite">
      <p id="private-context" class="note"></p>
      <small>95% Prediction Interval for PaCO₂</small>
      <strong id="private-bounds"></strong>
      <p id="private-median"></p>
    </div>
    <div id="private-chart"></div>
    <div id="private-interpretation" class="prediction-interpretation" hidden></div>
    <button type="button" id="close-chart" class="text-button">Close chart</button>
  </section>
  <noscript>Enable JavaScript to open the interactive chart.</noscript>
</main>
<script type="module">
/* DISTRIBUTION_MODULE */
/* INTERPRETATION_MODULE */

const byId = (id) => document.getElementById(id);
const settingNames = {
  all: "All eligible settings", icu: "ICU billing proxy",
  ed_inp: "Emergency department / inpatient", pft: "Ambulatory",
};
const fmt = new Intl.NumberFormat("en-US", {maximumSignificantDigits: 12}).format;
let revision = 0, grid = null;

function closeChart() {
  revision++;
  grid = null;
  byId("private-grid").hidden = true;
  byId("private-result").hidden = true;
  showDistribution(byId("private-chart"), null);
  showInterpretation(byId("private-interpretation"), null);
  for (const id of ["private-bounds", "private-context", "private-median", "chart-status"]) {
    byId(id).textContent = "";
  }
  byId("file-panel").open = true;
  byId("file-summary").textContent = "Open private chart";
}

byId("close-chart").addEventListener("click", () => {
  byId("chart-file").value = "";
  closeChart();
  byId("chart-file").focus();
});

function renderRow(data) {
    byId("private-summary").hidden = false;
    showInterpretation(byId("private-interpretation"), null);
    const q = data.interval;
    const endpoint = (v, index) => data.report ? reportLabel(data.report.quantiles[index ?? q.indexOf(v)]) : fmt(v);
    const bounds = hasInterval(q) ? endpoint(q[0],0) + " to " + endpoint(q[2],2) + " mmHg" : "Unresolved";
    byId("private-bounds").textContent = bounds;
    byId("private-context").textContent = (data.source === "trinetx" ? "TriNetX" : "Synthetic example") +
      " · " + settingNames[data.target];
    if (data.index_policy === "equal_patient_weight_split_across_eligible_draws_on_first_testing_day") {
      byId("private-context").textContent += ". Each patient contributes equal weight, split among their recorded arterial results on their first testing day.";
    }
    byId("private-median").textContent = data.report ? (q?.[1] != null ? "Median " + endpoint(q[1],1) + " mmHg" : "Median unresolved") + (hasInterval(q) ? " · Width " + reportedWidth(data.report) + " mmHg" : "") : q
      ? "Median " + fmt(q[1]) + " mmHg · Width " + fmt(q[2] - q[0]) + " mmHg"
      : "The fit does not resolve the interval at this reading.";
    byId("private-result").hidden = false;
    showDistribution(byId("private-chart"), {
      kind: "posterior", title: "PaCO₂ given TcCO₂ " + data.tcco2 + " mmHg",
      x: data.support, prior: data.prior, mass: data.mass, q, report: data.report, endpointLabel: endpoint, tails: data.tails,
      tc: data.tcco2, display: data.display, formatEndpoint: fmt,
      curve: { x: data.support.map(v => v - data.tcco2), density: data.likelihood },
    });
    if (hasInterval(q)) showInterpretation(byId("private-interpretation"), {
      source: data.source, setting: data.target,
      settingText: data.version.endsWith("_v2") && data.target==="pft" ? "in ambulatory encounters" : undefined,
      reading: fmt(data.tcco2), bounds,
    });
}

function renderGrid() {
  if (!grid) return;
  const tc = byId("private-reading").valueAsNumber;
  const target = byId("private-setting").value;
  const group = grid.groups[target];
  byId("private-result").hidden = false;
  const valid = Number.isInteger(tc) && tc >= 20 && tc <= 100;
  byId("private-summary").hidden = !valid;
  if (!valid) {
    showDistribution(byId("private-chart"), null);
    showInterpretation(byId("private-interpretation"), null);
    byId("chart-status").textContent = "Enter a whole-number reading from 20 to 100 mmHg.";
    return;
  }
  byId("chart-status").textContent = "";
  renderRow({...grid, ...group, ...group.rows[tc-20], target, tcco2: tc});
}
byId("private-reading").addEventListener("input",renderGrid);
byId("private-setting").addEventListener("change",renderGrid);
byId("chart-file").addEventListener("change", async (event) => {
  closeChart();
  const request = revision;
  const file = event.target.files[0];
  if (!file) return;
  byId("chart-status").textContent = "Opening chart…";
  try {
    const bytes = await file.arrayBuffer();
    const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
    if (request !== revision) return;
    if (Array.from(hash, b => b.toString(16).padStart(2, "0")).join("") !== "EXPECTED_CHART_SHA256") {
      byId("chart-status").textContent = "This file does not match this viewer. Choose the chart from the same output folder.";
      return;
    }
    // This hash pins the complete Python-generated document, including the resolved
    // summaries and exact masses. JavaScript only formats and plots those values.
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (!["conditional_lookup_private_chart_v1","conditional_lookup_private_chart_v2"].includes(data.version) ||
        data.method !== "future_setting_joint_v1" || data.prior_uncertainty !== "fixed_empirical" ||
        !["trinetx", "synthetic"].includes(data.source) ||
        (data.version.endsWith("_v1") && (!Object.hasOwn(settingNames,data.target) || data.tcco2!==47))) throw new Error();

    if (data.version === "conditional_lookup_private_chart_v2") {
      grid = data;
      byId("private-grid").hidden = false;
      byId("private-setting").value = "all";
      byId("private-reading").value = "47";
      renderGrid();
    } else renderRow(data);
    byId("file-panel").open = false;
    byId("file-summary").textContent = "Change chart file";
    byId("chart-status").textContent = "";
  } catch {
    if (request !== revision) return;
    closeChart();
    byId("chart-status").textContent = "Unable to open this chart. Open preview.html in a local browser and choose its matching JSON file.";
  }
});
</script>
</body>
</html>
